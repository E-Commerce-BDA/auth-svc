services:
  postgres:
    image: postgres:16
    container_name: ecom-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-ecom}
    ports:
      - "5432:5432"
    volumes:
      - ecom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER:-ecom}", "-d", "${POSTGRES_DB:-ecom}"]
      interval: 5s
      timeout: 3s
      retries: 10

# Redis lands here when sessions/rate-limit arrive (au-001 later phase)
